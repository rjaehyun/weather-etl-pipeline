name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets you run it manually from the Actions tab

# Cancel older runs of the same branch when you push again
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read your code
permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  pipeline:
    name: Pipeline smoke test
    runs-on: ubuntu-latest
    needs: test                       # only runs if the unit tests pass
    timeout-minutes: 10
    # Calls a live API, so skip it on PRs to avoid flaky failures
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data folder
        run: mkdir -p data

      - name: Initialize database
        run: python src/init_db.py

      - name: Run pipeline (fetch, clean, validate, load)
        run: python -m src.fetch_weather

      - name: Run SQL queries
        run: python src/run_queries.py